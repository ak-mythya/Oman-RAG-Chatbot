<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MOSD Chatbot</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="main-website">
    

    <div class="main-nav">
      <a href="#" class="nav-item active">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </a>
      <a href="#" class="nav-item">
        <i class="fas fa-info-circle"></i>
        <span>About the Ministry</span>
      </a>
      <a href="#" class="nav-item">
        <i class="fas fa-file-alt"></i>
        <span>Ministry Reports</span>
      </a>
      <a href="#" class="nav-item">
        <i class="fas fa-handshake"></i>
        <span>Services</span>
      </a>
      <a href="#" class="nav-item">
        <i class="fas fa-comments"></i>
        <span>Electronic Participation</span>
      </a>
      <a href="#" class="nav-item">
        <i class="fas fa-newspaper"></i>
        <span>Media Center</span>
      </a>
      <a href="#" class="nav-item">
        <i class="fas fa-info"></i>
        <span>Information Center</span>
      </a>
      <a href="#" class="nav-item">
        <i class="fas fa-phone"></i>
        <span>Contact us</span>
      </a>
      <a href="#" class="nav-item">
        <i class="fas fa-project-diagram"></i>
        <span>Initiatives and projects</span>
      </a>
    </div>

    <div class="banner-area">
      <div class="banner-content">
        <div class="tablet-display">
          <img src="/static/img/tablet-image.png" alt="Tablet Display">
        </div>
        <div class="arabic-text">
          <div class="main-title">لك أثر</div>
          <div class="subtitle">حروف على مداد الخير</div>
          <div class="edition">العدد الرابع | 2025م</div>
        </div>
      </div>
    </div>
  </div>

  <div id="chat-button" class="chat-button">
    <i class="fas fa-comment-dots"></i>
  </div>

  <div id="chat-overlay" class="chat-overlay hidden">
    <div class="chat-window">
      <div class="chat-header">
        <div class="chat-header-left">
          <img src="/static/img/logo-text.png" alt="Logo" class="header-logo-text">
        </div>
        <div class="chat-controls">
          <button id="minimize-button" class="window-control">
            <i class="fas fa-minus"></i>
          </button>
          <button id="close-button" class="window-control">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </div>

      <div class="chat-body">
        <div id="chat-box" class="chat-box">
          </div>

        <form id="chat-form" action="javascript:void(0);">
          <input type="text" id="user-input" placeholder="اكتب رسالتك..." autocomplete="off" required> <button type="submit" id="send-button" class="send-button">
            <i class="fas fa-arrow-up"></i>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
